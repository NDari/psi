[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
futures-util = "0.3.34"
ignore = "0.4.34"
# fzf-style fuzzy scoring for @ completion (Helix; Codex uses it too).
nucleo-matcher = "0.3.1"
regex = "1.13.1"
# Plain HTTP for now (llama-server on localhost); TLS joins with remote providers.
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "json"] }
rustix = { version = "1", features = ["process"] }
sha2 = "0.11.1"
strsim = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util", "fs", "signal"] }
tokio-util = "0.7.20"
tree-sitter = "0.27.1"
tree-sitter-bash = "0.25.1"
uuid = { version = "1.29.0", features = ["v7"] }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
# Dynamic shell completion (`COMPLETE=fish psi | source`).
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
crossterm = { version = "0.29.0", features = ["use-dev-tty"] } # level-triggered input: mio's edge-triggered source drops a key or a resize that arrive together
jsonc-parser = { version = "0.34.0", features = ["serde", "cst"] }
serde = { version = "1.0.229", features = ["derive"] }
similar = { version = "3.2.1", features = ["inline"] }
# preserve_order: tool schemas and examples keep their declared key order (H-05).
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
vt100 = "0.18.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
