[package]
name = "psi-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
jsonc-parser.workspace = true
psi-ai = { path = "../psi-ai" }
reqwest.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "process-group"] }
rmcp = { version = "3.8.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }

[features]
# A fake server over an in-process pipe, for tests.
testing = ["rmcp/server", "rmcp/transport-io"]

# A real stdio server for the tests (tests/stdio.rs).
[[bin]]
name = "psi-mcp-fake"
required-features = ["testing"]
test = false
doc = false

[dev-dependencies]
psi-mcp = { path = ".", features = ["testing"] }

[lints]
workspace = true
