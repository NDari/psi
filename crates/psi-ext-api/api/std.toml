# Batteries (psi-plan.md §9.4, D-45): Rust-backed modules for what Lua
# lacks. `builtin = true` functions are implemented once in
# src/batteries.rs, as default methods of ExtHost; the others go through
# the host (psi.exec and psi.http reach the agent's sandbox, policy and
# network setting).

# ---- Processes --------------------------------------------------------------

[[function]]
name = "exec"
doc = "Run a program and wait for it, inside the same boundary as bash, with bash's environment. Commands on the always-ask list ask the user (the card names this extension); headless runs refuse them. `{\"sh\", \"-c\", script}` is checked like a bash command. Errors when refused, denied or the program can't start; a non-zero exit is a result. Esc stops it. Use it instead of io.popen and os.execute, which extensions don't have."
async = true
params = [
  { name = "argv", type = "string[]" },
  { name = "opts", type = "ExecOptions?" },
]
returns = "ExecResult"

# ---- HTTP -------------------------------------------------------------------

[[function]]
name = "http.request"
doc = "Make an HTTP or HTTPS request. Errors when the network is off (the `network` setting), on a bad URL, or when the connection fails or times out; any status is a response. Esc stops it."
async = true
params = [{ name = "req", type = "HttpRequest" }]
returns = "HttpResponse"

[[function]]
name = "http.get"
doc = "A GET request: psi.http.request{ url = url }."
async = true
params = [{ name = "url", type = "string" }]
returns = "HttpResponse"

# ---- JSON -------------------------------------------------------------------

[[function]]
name = "json.encode"
doc = "A value as JSON. Keys come out sorted. An empty table is {} unless marked with psi.json.array; functions are an error."
builtin = true
params = [
  { name = "value", type = "any" },
  { name = "opts", type = "JsonOptions?" },
]
returns = "string"

[[function]]
name = "json.decode"
doc = "Parses JSON. null becomes psi.json.null() (so arrays keep their length), and arrays decode marked as arrays."
builtin = true
params = [{ name = "text", type = "string" }]
returns = "any"

[[function]]
name = "json.null"
doc = "The value JSON null decodes to; put it in a table to encode a null."
builtin = true
returns = "any"

[[function]]
name = "json.array"
doc = "Marks a table as an array, so it encodes as [] even when empty. Returns the table."
builtin = true
params = [{ name = "t", type = "table" }]
returns = "table"

# ---- Regular expressions ----------------------------------------------------

[[function]]
name = "re.is_match"
doc = "Whether `pattern` matches anywhere in `text`. Patterns use Rust regex syntax (Perl-like, without lookaround or backreferences); (?i) ignores case."
builtin = true
params = [
  { name = "pattern", type = "string" },
  { name = "text", type = "string" },
]
returns = "boolean"

[[function]]
name = "re.find"
doc = "The first match, or nil."
builtin = true
params = [
  { name = "pattern", type = "string" },
  { name = "text", type = "string" },
]
returns = "Match?"

[[function]]
name = "re.find_all"
doc = "Every match that doesn't overlap the one before, in order."
builtin = true
params = [
  { name = "pattern", type = "string" },
  { name = "text", type = "string" },
]
returns = "Match[]"

[[function]]
name = "re.replace"
doc = "`text` with matches replaced: all of them, or the first `limit`. In `replacement`, $1 and ${name} are capture groups and $$ is a dollar sign."
builtin = true
params = [
  { name = "pattern", type = "string" },
  { name = "text", type = "string" },
  { name = "replacement", type = "string" },
  { name = "limit", type = "integer?" },
]
returns = "string"

[[function]]
name = "re.split"
doc = "`text` split at each match."
builtin = true
params = [
  { name = "pattern", type = "string" },
  { name = "text", type = "string" },
]
returns = "string[]"

[[function]]
name = "re.escape"
doc = "`s` with every regex special character escaped, so a pattern matches it literally: `\"^\" .. psi.re.escape(dir)`."
builtin = true
params = [{ name = "s", type = "string" }]
returns = "string"

# ---- Paths and files --------------------------------------------------------

[[function]]
name = "path.join"
doc = "`part` under `base`; an absolute `part` replaces `base`."
builtin = true
params = [
  { name = "base", type = "string" },
  { name = "part", type = "string" },
]
returns = "string"

[[function]]
name = "path.normalize"
doc = "The path with `.` and `..` resolved, without looking at the disk."
builtin = true
params = [{ name = "p", type = "string" }]
returns = "string"

[[function]]
name = "path.absolute"
doc = "The path from the working directory, normalized."
builtin = true
params = [{ name = "p", type = "string" }]
returns = "string"

[[function]]
name = "path.relative"
doc = "`p` relative to `base` (default: the working directory), with `..` where needed; a result starting with `..` lies outside `base`."
builtin = true
params = [
  { name = "p", type = "string" },
  { name = "base", type = "string?" },
]
returns = "string"

[[function]]
name = "path.basename"
doc = "The last part: \"c.txt\" for \"a/b/c.txt\"."
builtin = true
params = [{ name = "p", type = "string" }]
returns = "string"

[[function]]
name = "path.dirname"
doc = "Everything but the last part: \"a/b\" for \"a/b/c.txt\", \".\" for \"c.txt\"."
builtin = true
params = [{ name = "p", type = "string" }]
returns = "string"

[[function]]
name = "path.ext"
doc = "The extension without the dot: \"txt\" for \"a/b/c.txt\", \"\" when there is none."
builtin = true
params = [{ name = "p", type = "string" }]
returns = "string"

[[function]]
name = "fs.read"
doc = "A file's contents. Errors when it can't be read."
builtin = true
params = [{ name = "path", type = "string" }]
returns = "string"

[[function]]
name = "fs.write"
doc = "Writes a file, creating its directories. Inside the workspace, the next checkpoint captures the change."
builtin = true
params = [
  { name = "path", type = "string" },
  { name = "data", type = "string" },
]

[[function]]
name = "fs.exists"
doc = "Whether the path exists."
builtin = true
params = [{ name = "path", type = "string" }]
returns = "boolean"

[[function]]
name = "fs.stat"
doc = "What the path is (following links), or nil when it doesn't exist."
builtin = true
params = [{ name = "path", type = "string" }]
returns = "Stat?"

[[function]]
name = "fs.list"
doc = "The names in a directory, sorted."
builtin = true
params = [{ name = "dir", type = "string" }]
returns = "string[]"

[[function]]
name = "fs.glob"
doc = "Files matching a glob like \"src/**/*.rs\" (`*` stays within one directory), relative to the working directory or `opts.cwd`, sorted. Skips what .gitignore ignores, hidden files and .git, unless `gitignore = false`."
builtin = true
params = [
  { name = "pattern", type = "string" },
  { name = "opts", type = "GlobOptions?" },
]
returns = "string[]"

# ---- Formats ----------------------------------------------------------------

[[function]]
name = "toml.decode"
doc = "Parses a TOML document into a table; dates become strings."
builtin = true
params = [{ name = "text", type = "string" }]
returns = "table"

[[function]]
name = "toml.encode"
doc = "A table as a TOML document."
builtin = true
params = [{ name = "t", type = "table" }]
returns = "string"

[[function]]
name = "base64.encode"
doc = "Standard base64, with padding."
builtin = true
params = [{ name = "data", type = "string" }]
returns = "string"

[[function]]
name = "base64.decode"
doc = "Decodes standard base64. Errors on anything else."
builtin = true
params = [{ name = "text", type = "string" }]
returns = "string"

[[function]]
name = "hash.sha256"
doc = "The SHA-256 of the data, in lowercase hex."
builtin = true
params = [{ name = "data", type = "string" }]
returns = "string"

# ---- Time -------------------------------------------------------------------

[[function]]
name = "time.now"
doc = "Seconds since 1970 (UTC), with a fraction."
builtin = true
returns = "number"

[[function]]
name = "time.format"
doc = "A time in local time, with strftime codes (default \"%Y-%m-%dT%H:%M:%S%:z\"); `t` defaults to now."
builtin = true
params = [
  { name = "t", type = "number?" },
  { name = "fmt", type = "string?" },
]
returns = "string"

[[function]]
name = "time.parse"
doc = "Seconds since 1970 for a time written as RFC 3339 (\"2026-11-02T10:00:00Z\"), or with strftime codes in `fmt` (local time unless it has %z). nil when it doesn't parse."
builtin = true
params = [
  { name = "text", type = "string" },
  { name = "fmt", type = "string?" },
]
returns = "number?"

# ---- Types ------------------------------------------------------------------

[[type]]
name = "ExecOptions"
fields = [
  { name = "cwd", type = "string?", doc = "Where it runs (default: the working directory)" },
  { name = "env", type = "{string: string}?", doc = "Variables to add" },
  { name = "stdin", type = "string?", doc = "Its input (default: none)" },
  { name = "timeout_ms", type = "integer?", doc = "Stopped after this long (default 60000)" },
  { name = "max_bytes", type = "integer?", doc = "Each of stdout and stderr is cut after this many bytes (default 1048576)" },
]

[[type]]
name = "ExecResult"
fields = [
  { name = "code", type = "integer?", doc = "The exit code; nil when it was stopped" },
  { name = "ok", type = "boolean", doc = "It exited with 0" },
  { name = "stdout", type = "string", doc = "" },
  { name = "stderr", type = "string", doc = "" },
  { name = "killed", type = "boolean", doc = "Stopped by the timeout, Esc or a signal" },
  { name = "truncated", type = "boolean", doc = "stdout or stderr was cut at max_bytes" },
]

[[type]]
name = "HttpRequest"
fields = [
  { name = "url", type = "string", doc = "" },
  { name = "method", type = "string?", doc = "Default GET, or POST with a body" },
  { name = "headers", type = "{string: string}?", doc = "" },
  { name = "query", type = "{string: string}?", doc = "Added to the URL, encoded" },
  { name = "body", type = "string?", doc = "" },
  { name = "json", type = "any", doc = "Sent as a JSON body (and Content-Type) instead of `body`" },
  { name = "timeout_ms", type = "integer?", doc = "Default 30000" },
  { name = "max_bytes", type = "integer?", doc = "The body is cut after this many bytes (default 10485760)" },
]

[[type]]
name = "HttpResponse"
fields = [
  { name = "status", type = "integer", doc = "" },
  { name = "ok", type = "boolean", doc = "The status is 2xx" },
  { name = "headers", type = "{string: string}", doc = "Lowercase names; repeated headers joined with \", \"" },
  { name = "body", type = "string", doc = "" },
  { name = "truncated", type = "boolean", doc = "The body was cut at max_bytes" },
  { name = "json", type = "function(): any", doc = "The body decoded as JSON (psi.json.decode)" },
]

[[type]]
name = "JsonOptions"
fields = [{ name = "pretty", type = "boolean?", doc = "Indented, one value per line" }]

[[type]]
name = "Match"
doc = "A regex match. Positions are byte offsets, 1-based and inclusive, as string.find gives."
fields = [
  { name = "text", type = "string", doc = "The matched text" },
  { name = "start", type = "integer", doc = "" },
  { name = "finish", type = "integer", doc = "" },
  { name = "groups", type = "string[]", doc = "The capture groups in order; \"\" for one that didn't take part" },
  { name = "named", type = "{string: string}", doc = "Named groups that took part" },
]

[[type]]
name = "Stat"
fields = [
  { name = "kind", type = "\"file\"|\"dir\"|\"other\"", doc = "" },
  { name = "size", type = "integer", doc = "In bytes" },
  { name = "modified", type = "number", doc = "Seconds since 1970" },
]

[[type]]
name = "GlobOptions"
fields = [
  { name = "cwd", type = "string?", doc = "Where to search from" },
  { name = "gitignore", type = "boolean?", doc = "Skip ignored and hidden files (default true)" },
]
